<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q1 Project</title>

  <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 40px;
      text-align: center;
      color: #131313;

    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 24px;
      margin-top: 25px;
    }

    h3 {
      font-size: 20px;
      margin-top: 0;
    }

    a {
      color: #06c;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
    
    .container {
      width: 350px;
      margin: 15px auto;
      padding: 25px;
      background-color: white;
      border: 2px solid #cccccc;
      border-radius: 10px;
      text-align: left;
    }

    .receipt {
      width: 350px;
      margin: 20px auto;
      padding: 20px;
      background-color: white;
      border: 2px solid #cccccc;
      border-radius: 10px;
      text-align: left;
    }

    .receipt_title {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
    }
  
    .receipt_total {
      font-weight: bold;
      font-size: 20px;
      border-top: 2px solid #cccccc;
      padding-top: 10px;
      margin-top: 15px;
    }

    label {
      font-size: 16px;
    }
    
    button {
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    
  </style>
</head>
<body>

  <h1>Sven & Eli's Virtual Vending Machine </h1>
  <a href="page1.html">SKU Generator</a>
  <h2>Items: </h2>

<!--Snacks-->
  <div class="container" id="snacks">
    <h3>Snacks</h3>

    <label>
      <input type="checkbox" id="chips">
      <span>Chips - $5.00</span>
    </label><br>

    <label>
      <input type="checkbox" id="biscuits">
      <span>Biscuits - $2.50</span>
    </label><br>

    <label>
      <input type="checkbox" id="gummies">
      <span>Gummies - $2.00</span>
    </label>
  </div><br>

<!--Drinks-->
  <div class="container" id="drinks">
    <h3>Drinks</h3>

    <label>
      <input type="checkbox" id="soda">
      <span>Soda - $1.50</span>
    </label><br>

    <label>
      <input type="checkbox" id="water">
      <span>Water - $1.00</span>
    </label><br>

    <label>
      <input type="checkbox" id="juice">
      <span>Fruit Juice - $1.50</span>
    </label>
  </div><br>

  <button type="button" py-click="order">Create Order</button><br><br>

  <div class="receipt">

    <div class="receipt_title">===== RECEIPT =====</div>
      <div class="receipt_row">Subtotal: 
        <span id="subtotal">$0.00</span>
      </div>

      <div class="receipt_row">VAT: 
        <span id="vat">$0.00</span>
      </div>

      <div class="receipt_row">Total:
        <span id="total">$0.00</span>
      </div>
  </div>


<script type="py" src="receipt.py"></script>
</body>
</html>
