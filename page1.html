<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q1 Project</title>

  <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
</head>
<body>
  <h1>Sven & Eli's Virtual Vending Machine </h1>
  <a href="index.html">Receipt Generator</a><br><br>


  <label>Category</label><br><br>
  <select id="category">
    <option value="SNA">Snacks</option>
    <option value="DRI">Drinks</option>
  </select><br><br>

  <label>Product Name</label><br><br>
  <input type="text" id="pr_name" placeholder="e.g., Fruit Juice"><br><br>

  <label>Quantity</label><br><br>
  <input type="number" id="quantity" placeholder="e.g., 50"><br><br>

  <button py-click="generate_sku">Generate SKU</button><br><br>
  
  <div>
    <span id="sku">XXX-XXX-XXX</span>
  </div>

  
  <script type="py" src="sku.py"></script>
</body>
</html>
