<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q1 Project</title>

  <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: 30px;
    }

    a {
      color: #06c;
      text-decoration: none;
    }

    .generator {
      width: 350px;
      margin: 30px auto;
      padding: 25px;
      background-color: white;
      border: 2px solid #cccccc;
      border-radius: 10px;
      text-align: left;
    }

    .generator h2 {
      text-align: center;
    }

    label {
      font-size: 16px;
    }

    select, input {
      width: 100%;
      padding: 10px;
      margin: 5px 0 15px;
      box-sizing: border-box;
      border: 1px solid #aaaaaa;
      border-radius: 5px;
      font-size: 16px;
    }

    button {
      display: block;
      margin: 5px auto 20px;
      padding: 10px 20px;
      background-color: #06c;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }

    #sku {
      display: block;
      padding: 15px;
      background-color: #e0dddd;
      border: 2px solid #cccccc;
      border-radius: 5px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;

    button {
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>

</head>
<body>
  <h1>Sven & Eli's Virtual Vending Machine </h1>
  <a href="index.html">Receipt Generator</a><br><br>


  <label>Category</label><br><br>
  <select id="category">
    <option value="SNA">Snacks</option>
    <option value="DRI">Drinks</option>
  </select><br><br>

  <label>Product Name</label><br><br>
  <input type="text" id="pr_name" placeholder="e.g., Fruit Juice"><br><br>

  <label>Quantity</label><br><br>
  <input type="number" id="quantity" placeholder="e.g., 50"><br><br>

  <button py-click="generate_sku">Generate SKU</button><br><br>
  
  <div>
    <span id="sku">XXX-XXX-XXX</span>
  </div>

  
  <script type="py" src="sku.py"></script>
</body>
</html>
